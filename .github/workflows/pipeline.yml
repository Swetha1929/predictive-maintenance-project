name: ML Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Streamlit App
        run: python -m py_compile app.py

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          rm -rf /tmp/hf-space
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/Swetha1929/maintenance-engine" /tmp/hf-space

          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'Data/' \
            --exclude 'models/' \
            --exclude '__pycache__/' \
            --exclude '.ipynb_checkpoints/' \
            --exclude '*.ipynb' \
            --exclude '*.pkl' \
            --exclude '*.db' \
            ./ /tmp/hf-space/

          cd /tmp/hf-space
          git add -A
          git commit -m "Deploy from GitHub Actions" || true
          git push
